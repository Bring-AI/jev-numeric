[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-numeric"
version = "0.1.0"
description = "Numerical output from Jev through discrete choices and hierarchical interval decoding"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
jev-numeric = "jev_numeric.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
